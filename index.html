<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Live Zoom Code</title>
    <meta name="description" content="" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />

    <!-- Hasil compile Tailwind (jalankan: npm run dev) -->
    <link href="./src/output.css" rel="stylesheet" />
  </head>

  <body>
    <!-- NAVBAR -->
    <header
      aria-label="Site header"
      id="site-header"
      class="fixed top-0 z-50 w-full"
    >
      <div class="flex-between custom-container md:h-21 h-16">
        <!-- logo -->
        <a href="#hero" aria-label="Beranda">
          <img
            src="./assets/images/logo.svg"
            alt="logo"
            width="158"
            height="36"
            class="max-w-35.25 max-h-8 max-md:h-9 max-md-w-39.5"
          />
        </a>
        <!-- menu desktop -->
        <nav class="hidden lg:block" aria-label="Primary Navigation">
          <ul class="flex-start gap-3">
            <li>
              <a class="hover:text-primary-300 p-4" href="#about">About</a>
            </li>
            <li>
              <a class="hover:text-primary-300 p-4" href="#services">Service</a>
            </li>
            <li>
              <a class="hover:text-primary-300 p-4" href="#projects"
                >Projects</a
              >
            </li>
            <li>
              <a class="hover:text-primary-300 p-4" href="#testimonials"
                >Testimonials</a
              >
            </li>
            <li><a class="hover:text-primary-300 p-4" href="#faq">FAQ</a></li>
          </ul>
        </nav>
        <!-- tombol -->
        <a
          class="bg-primary-300 text-sm-medium text-neutral-25 px-14.5 hidden h-11 shrink-0 cursor-pointer rounded-full justify-center outline-none lg:flex items-center"
          aria-label="Get Started"
          href="#contact"
          >Get Started</a
        >

        <!-- mobile button -->
        <button
          class="cursor-pointer lg:hidden"
          type="button"
          id="menu-open"
          aria-label="Open main navigation"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="4" x2="20" y1="6" y2="6" />
            <line x1="4" x2="20" y1="12" y2="12" />
            <line x1="4" x2="20" y1="18" y2="18" />
          </svg>
        </button>
      </div>
    </header>

    <!-- main content -->

    <main>
      <!-- section hero -->

      <h1>Hero</h1>
    </main>

    <script src="./js/main.js"></script>
  </body>
</html>
